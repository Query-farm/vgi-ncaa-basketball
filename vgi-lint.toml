location = "uv run --project . vgi-ncaa-basketball"
select = ["ALL"]
fail_on = "warning"

ignore = [
  { code = "VGI311", kind = "tooling-bug", reason = """\
Each parameterless all_* scan is exposed as its corresponding table (all_current_standings \
backs current_standings, all_teams backs teams, and so on). The rule only recognizes matching \
names, but a function and a table cannot share a name inside one schema; the deliberate all_* \
names avoid that collision.\
""" },
]

# The all_* functions are the scans behind the ordinary tables. Agent tasks exercise the
# public tables instead; teaching agents to call implementation functions directly would
# undermine the table abstraction. The hermetic Haybarn E2E test executes every table (and
# therefore every backing scan) in both schemas.

[per_object."ncaa_basketball.mens.all_conferences"]
ignore = [{ code = "VGI520", kind = "domain-exemption", reason = "Backing scan for mens.conferences; agent tasks and the hermetic E2E test exercise it through that table." }]

[per_object."ncaa_basketball.mens.all_current_player_stats"]
ignore = [{ code = "VGI520", kind = "domain-exemption", reason = "Backing scan for mens.current_player_stats; agent tasks and the hermetic E2E test exercise it through that table." }]

