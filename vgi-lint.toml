# The mens and womens schemas are generated from one implementation per function
# (functions.build_functions binds only the ESPN league slug and ncaa-api sport).
# The agent suite stays within 10 tasks by exercising each function shape once, in
# whichever schema makes the more natural question; the twin below is the identical
# code path over the other league. Unit tests parse fixtures for both leagues and
# the hermetic E2E test queries every table in both schemas.

[per_object."ncaa_basketball.mens.bracket"]
ignore = [{ code = "VGI520", kind = "domain-exemption", reason = "Same implementation as ncaa_basketball.womens.bracket, which agent task womens_2026_champion exercises; only the upstream league differs." }]

